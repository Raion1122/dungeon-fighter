<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ダンジョンファイターズ — 地方全景</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <!--
    world.html — 地方全景 (ワールドマップ)
    ═══════════════════════════════════════════════════════════════════════
    実装依頼書 `実装依頼書/2026-08-25_world-map-entry.md`。検証は tools/verify_world_map.js。

    ★ このファイルの責務は「世界のどこに立っているか」と「どこへ歩くか」だけ。
      ⛔ **ゲームロジックを書かない。** パーティ編成・装備・クエスト・戦闘は 1 つも持たない。
      ⛔ **数値の写しを作らない。** ノード / エッジ / 拠点 / 立ち位置は js/world-map.js が唯一の正。
        クラス定義は js/hero-classes.js、セーブは js/save-slots.js。
      (town.html の設計思想をそのまま持ってきている。器は薄く、データは 1 箇所)

    ★ 読み込むのは 4 本だけ (依頼書 §6-1 の指定。これ以上増やさない)
        js/save-slots.js  … 記録の切り替えは title.html の担当。ここでは同席させるだけ
        js/hero-classes.js… 主人公のクラスキーの妥当性確認 (未知なら warrior へ)
        js/world-map.js   … ルートグラフ / 拠点 / 立ち位置
        audio.js          … BGM ("world" = fierd.mp3) と効果音
                            ⚠ 呼び口は **ロード時 + 最初の pointerdown の 2 本** (下の「音」の節)。

    ★⭐⭐⭐ 罠 C — 「絵の道」と「歩けるデータ」を別々に持つと必ずズレる (依頼書 §2-4)
      街道の描き幅は 1 マス 64px に対して実測 ~10px しかないので、**通行マスクは作らない**。
      画面に描く点線は WORLD_MAP.EDGES **ただ 1 つ**から生成し、歩ける経路も同じ配列から引く。
      ⚠ この HTML の中で「ノード座標 → 線の端点」を計算しているのは
        **edgeEnds() の 1 箇所だけ**。⛔ 2 箇所目を作らないこと
        (負のコントロール maskdrift の変異アンカーが 2 ヒットして exit 3 になる)。

    ★ 点線の見た目 (依頼書 §12-2 の実測)
      全区間の直下が中〜暗調 (luma mean 72.2〜116.7 / 区間内 max 146.6) なので **明色 1 色でよい**。
      ⚠ 縁取りを省くと最も明るい区間 (farm_n—pass_n の max 146.6) で線が溶ける。
      → 明色 (#f6ead0 = luma 234.7) の丸い点 + **暗色の縁取り**。
        縁取りは `<g>` に掛けた drop-shadow で作る。
        ⭐ こうすると **1 エッジ = <line> 1 本**のまま縁取りが乗る。
        ⚠⚠ 縁取りを「同じ座標にもう 1 本太い線を敷く」方式でやると、線分の本数が
           EDGES.length の 2 倍になり、受入条件 (2a) が原理的に測れなくなる。

    ★ スプライト (依頼書 §6-2 の 4 / town.html と同じ規則)
      assets/<class>_walk.png は全 6 職とも 576x384 = **96px セル 6 列 x 4 行**。
      **row 3 が右向き**、左へ歩くときは scaleX(-1)。
      ⭐ **足元をノード座標に置く** (top = y - 96*0.93)。
        town.html は「足元をタイル中心に置く」だったので、その規則を
        「足元を**ルート上の点**に置く」へ読み替えただけ。⚠ この 0.93 を動かさない。

    ★ カメラ (依頼書 §6-2 の 5 / town.html の layout() / insets() を流用)
      デスクトップ: 1536x1024 が **帯を除いた領域に** 全部入る倍率で固定 (地図は全体が見えてこそ)。
      compact:      可視域を満たす倍率にして主人公を追う (縦持ちで上下が真っ黒になるのを避ける)。
      ⚠⚠ insets() = 上下の帯の高さを**実測して引く**。引かないと拠点の札が帯の下に潜る。
      ⭐ **黒帯を作らない工夫**: 全体を入れると 1536x1024 (3:2) と画面 (16:10 等) の
        アスペクト差ぶんだけ左右が余る。そこは黒く塗らず、**同じ地図をぼかして敷いた
        #worldBackdrop** で埋める (卓の上に地図を広げた見え方)。⛔ 画面を切り取って
        黒帯を消す (= 地図の端が見えなくなる) 方向へは倒さない。

    ★ 移動 (依頼書 §6-3)
      - **ノードをタップ** → WORLD_MAP.findPath でグラフ上を歩く。エッジ上は線形補間、
        向きは進行方向で scaleX。
      - ⛔ **線の無いところをタップしても動かない** (town.html の「歩けないタイルでは動かない」と
        同じ判断。隣接まで寄せる救済は入れない)。だから viewport には click ハンドラを置かない。
      - ⛔ 遷移先にクエリを足さない (#6 / #12 の確定作法)。

    ★⛔⛔⛔ 一回性のキーを 1 つも消さない (依頼書 §2-2 の罠 A)
      dragonfighters.exitVia を消費するのは town.html、enterVia / lastResult は tavern.html。
      ここは exitVia / currentScenario を **peek するだけ**で、enterVia / lastResult は
      **コメント以外の行に 1 度も出てこない**。詳細は下の「立ち位置」の節。

    ★ 撤退スイッチ ?world=0 (依頼書 §7) — ⛔ ?town=0 とは **独立**。判定順は
      `?town=0` (街ごと素通り) → `?world=0` (地図だけ素通り) → world.html。
      title.html の nextAfterTitle() が 3 段でこの順に判定する。

    ★ BGM (依頼書 §6-2 の 6 / §12-1)
      GameAudio.playBgm("world") = assets/bgm/fierd.mp3 (魔王魂 / volume 0.48)。
      呼び口は **ロード時 + 最初の pointerdown (unlock()) の 2 本** = town.html / title.html と
      同じ形。⭐ 実体は playWorldBgm() ただ 1 つへ畳んである (同じ 1 行を 2 箇所へ書くと
      負のコントロール silent の変異アンカーが 2 ヒットして exit 3 になる = #20 で実測)。
      ⚠⚠⚠ unlock() が鳴らす分は **モジュール内部の** playBgm を通るので
        GameAudio.playBgm を包んだスパイからは見えない → 検証は必ず 2 経路。

    ★ ダンジョンからの帰還もここへ落ちる (index.html の dfReturnPage() が 3 段判定で
      world.html を返す)。⚠ そのとき exitVia = "dungeon" が置かれているので、
      下の「立ち位置」が SITES[currentScenario] へ駒を置く。⛔ キーは 1 つも消さない。
  -->
  <style>
    :root {
      --parchment-ink: #3a2912;
      --parchment-gold: #8b6914;
      --route-ink: #f6ead0;            /* 点線の明色。luma 234.7 (依頼書 §12-2 の「luma >= 220」) */
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;                       /* ⚠ 受入条件 (5a): 横スクロールバーを出さない */
      background: #0a0805;
      color: #f5e8c8;
      font-family: 'Cinzel', 'Times New Roman', serif;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    /* ── 余白を埋める背景 ────────────────────────────────────────────────
       地図 (3:2) と画面のアスペクト差ぶんの余りを黒帯にしない。
       ⚠ 同じ URL なのでブラウザのキャッシュに乗る (2 回ダウンロードしない)。 */
    #worldBackdrop {
      position: fixed; inset: 0;
      background-image: url("assets/world_region.jpg");
      background-size: cover; background-position: center;
      filter: blur(22px) brightness(0.34) saturate(0.55);
      transform: scale(1.08);                 /* blur の縁が透けるのを隠す */
      pointer-events: none;
      z-index: 0;
    }

    /* ── 舞台 ────────────────────────────────────────────────────────────
       #worldViewport が画面いっぱいの窓、#worldStage が絵の実寸 (1536x1024)。
       拡大とカメラは **stage の transform 1 本**でやる (子要素は素の px 座標のままでよい)。 */
    #worldViewport {
      position: fixed; inset: 0;
      overflow: hidden;
      background: transparent;                /* ⚠ 黒で塗らない (#worldBackdrop を透かす) */
      z-index: 1;
    }
    #worldStage {
      position: absolute; left: 0; top: 0;
      transform-origin: 0 0;
      box-shadow: 0 0 34px 8px rgba(0,0,0,0.55);
    }
    /* ⭐ 背景画像を CSS の background ではなく <img> で敷く理由:
       受入条件 (0b) が **naturalWidth / naturalHeight を DOM から**読んで
       WORLD_MAP.W / H と突き合わせる。CSS background には自然寸法の読み口が無い。 */
    #worldBg {
      position: absolute; left: 0; top: 0;
      width: 100%; height: 100%;
      pointer-events: none; user-select: none; -webkit-user-drag: none;
    }

    /* ── ルート (点線) ───────────────────────────────────────────────────
       ⭐ 1 エッジ = <line> 1 本。⛔ 縁取りのために 2 本目を敷かない (受入条件 (2a))。 */
    #worldRoutes {
      position: absolute; left: 0; top: 0;
      overflow: visible;                      /* drop-shadow が切れないように */
      pointer-events: none;
      z-index: 1;
    }
    #worldRouteInk {
      /* 暗色の縁取り。#15 の羊皮紙立て札と同じ「明色 + 暗い縁」のトンマナ。 */
      filter: drop-shadow(0 0 1.6px rgba(0,0,0,0.95))
              drop-shadow(0 0 3.2px rgba(0,0,0,0.85));
    }
    .worldRouteLine {
      stroke: var(--route-ink);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 1 17;                 /* 丸い「点」が 18px おき = 点線 */
      fill: none;
    }

    /* 主人公。⚠ 96px セルを 1:1 で出す */
    #worldHero {
      position: absolute;
      width: 96px; height: 96px;
      background-repeat: no-repeat;
      background-size: 576px 384px;           /* 96px セル 6列 x 4行 */
      transform-origin: 50% 100%;
      pointer-events: none;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.55));
      /* ⭐ 拠点マーカー (.worldNode = z-index 4) は主人公の足元に重なるので、主人公を上へ出す
         = 立っている間はマーカーが体の後ろに隠れる (地面の印が体を突き抜けない)。
         ⚠ #worldHero は pointer-events: none なので、上に出しても (7d) の elementFromPoint も
           (3b)/(7e) の実クリックも一切変わらない。 */
      z-index: 5;
    }
    /* 足元の楕円影。⭐ 接地点 = ノード座標が「どこに立っているか」の唯一の手がかり */
    #worldHeroShadow {
      position: absolute;
      width: 44px; height: 16px;
      margin-left: -22px; margin-top: -8px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* 行き先マーカー */
    #worldGoal {
      position: absolute;
      width: 52px; height: 52px;
      margin-left: -26px; margin-top: -26px;
      border: 2px solid rgba(120,255,180,0.85);
      border-radius: 50%;
      box-shadow: inset 0 0 12px rgba(120,255,180,0.35);
      pointer-events: none; opacity: 0;
      z-index: 1;
      transition: opacity 0.25s ease;
    }
    #worldGoal.show { opacity: 1; }

    /* ── ノードの当たり判定 ──────────────────────────────────────────────
       ⭐⭐⭐ **1 ノード = 1 要素** (`data-node`)。site の 7 つは
         .worldNodeBody が **足元の拠点マーカー**、その兄弟 .worldSign が **頭上の羊皮紙**。
       ⚠ 受入条件 (7d) が「札の中心の elementFromPoint が自分自身か子孫」を要求するので、
         この要素より上に pointer-events を持つ物を重ねないこと
         (#worldHero / #worldHeroShadow / #worldGoal は全部 pointer-events: none)。 */
    .worldNode {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;
      cursor: pointer;
      z-index: 4;
    }
    /* ⚠ 丸い点は **中継点だけ**の見た目。拠点は下の .worldSign が上書きする。 */
    .worldNodeBody {
      display: block;
      transition: transform 0.12s ease;
    }
    .worldNode-way .worldNodeBody {
      /* ⭐ 2026-09-02 実機体感: 9px は街道の点線の点 (stroke-width 6 = 直径 6px) と見分けが付かず、
           「止まれる所」と「ただの線」が混ざって見える、という所見。点線の 2 倍を超える 13px へ。
         ⛔ .worldStepBody と **必ず同時に**動かす — (2f) が両者の実寸を突き合わせるので片方だけだと赤。 */
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--route-ink);
      box-shadow: 0 0 0 2.5px rgba(20,14,6,0.9), 0 2px 6px rgba(0,0,0,0.7);
    }
    .worldNode:hover .worldNodeBody { transform: scale(1.25); }
    /* ⚠ 札の中心出しは translateX(-50%) なので、scale だけ書くと translate が潰れて
       札が右へずれる (#15 の town.html で踏んだ罠と同型)。必ず合成して書く。 */
    .worldNode:hover .worldSign { transform: translateX(-50%) scale(1.05); }

    /* ── 歩みの刻み (#40) ─────────────────────────────────
       ⚠⚠ クラス名は **.worldStep**。⛔ .worldNode を着せないこと —
         tools/verify_world_map.js:736 の (3c) と :1187 が top.closest('.worldNode') で
         「押した先がノードでない」を測り、tools/verify_quest_walk.js:547 は札の
         所有者を同じ式で引いている (依頼書 §2-4)。着せると既存 golden が 3 本誤爆する。
       ⚠ 点線の点は stroke-width 6 + dasharray: 1 17 = **直径 6px が 18px おき**。
         ⭐⭐⭐ 止まれる点の大きさは、中継点でなく **この 6px と比べて**決める。
       ⭐ #42 (2026-09-02): 見た目 6px / 当たり判定 32px は実機で「タップできる点がまだ小さい」と
         判定されたので、**中継点 (.worldNode-way) と同寸の 9px / 44px** へ揃えた。
         ⛔ 拠点と同じ大きさにはしない — 拠点と中継点の差は「大きさ」でなく **中身があるか (◎ か ●)**
            という #21 の設計核を、刻み点が跨いでしまうため。
       ⭐⭐ 2026-09-02 (第 2 回): その 9px も **点線の点 (6px) と紛れる** と実機で判定された。
         ⚠ #42 は「刻み点 vs 中継点」だけを見ていて、比べる相手を **点線の点** に取っていなかった。
         ⇒ 止まれる点 13px / 拠点 17px へ引き上げ (点線 6px の 2.2 倍)。当たり判定 44px は不動。
       ⭐ z-index は **3** = 札 (.worldNode の 4) より下・主人公 (5) より下。
         刻みを細かくすると沼地/砦の札に 2 点が食い込むので紙の下へ潜らせている (#42 §2-2)。
       ⛔ 色・不透明度・影・hover 倍率は受入条件の「測らないこと」= 実機で見て調整してよい。
         機械が縛るのは「.worldNode を着ていない」(0c) と「中継点と同寸」(2f) と
         「札より下の層」(2e) の 3 つだけ。 */
    .worldStep {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;            /* 当たり判定。⭐ #42: .worldNode と**同じ** 44px
                                               (⛔ 44 を独立に決めない = (2f) が中継点から引いて突き合わせる) */
      cursor: pointer;
      z-index: 3;                           /* ⭐ #42: 札 (.worldNode = 4) より **下**。
                                               刻みを 2.5 マスへ細かくすると沼地・砦の札に 2 点が食い込むので、
                                               紙の下へ潜らせる (依頼書 §2-2 / §2-4)。
                                               ⚠ 中心は札の外にあるので押せる = (2d) が毎回その逃げ幅を測る。
                                               2026-09-02 実測: z4 のままだと札の隅を 2 件奪う / z3 で 0 件。 */
    }
    .worldStepBody {
      display: block;
      width: 13px; height: 13px;            /* ⭐ #42: 中継点 .worldNode-way と**同寸**へ (6px は実機で小さすぎた)
                                               ⭐ 2026-09-02: その 9px も点線の点 (6px) と紛れたので、中継点ごと 13px へ */
      border-radius: 50%;
      background: var(--route-ink);
      opacity: 0.85;
      box-shadow: 0 0 0 2.5px rgba(20,14,6,0.9), 0 1px 4px rgba(0,0,0,0.6);
      transition: transform 0.12s ease;
    }
    .worldStep:hover .worldStepBody { transform: scale(1.35); }

    /* ── 拠点の羊皮紙の立て札 (依頼書 §6-2 の 3) ─────────────────────────
       ⭐ 作法は #15 の town.html `.townSign` の流用。⛔ ただし DOM もセレクタも
         共有しない (town.html は 1 バイトも触らない)。
       ⭐⭐ **札は .worldNodeBody ではなく その兄弟** (2026-08-25 に分離)。当たり判定の親
         .worldNode[data-node] はノード中心の 44px 角のままなので、(3b) の「ノードをタップ →
         そこへ立つ」は不変。(7d) は札自身の矩形で測るので頭上へ出しても子孫のまま通る。
       ⚠⚠ #15 の実測: **可変幅の札は margin-left/-top: -32px では中心に置けない**。
         中心合わせは親 .worldNode の transform: translate(-50%,-50%) が担う。
         ⭐ だから :hover の scale は **子 (.worldNodeBody)** に掛ける。
           同じ要素へ書くと translate が潰れて札が右下へずれる (#15 で踏んだ罠)。
       ⚠ ステージの scale(zoom) で札の文字も縮む。desktop の実効 zoom は 0.82 前後なので
         実効文字高は 15px x 0.82 = 12.3px / 11px x 0.82 = 9.0px。
       ⛔ 説明文を opacity で薄めない。**紙が斑なので透かした瞬間に読めなくなる**
         (#15 の 2026-08-23 実測)。柔らかさは --wsp-ink-soft の**色**だけで出す。 */
    /* ── 拠点マーカー (2026-08-25) ───────────────────────────────────────
       ⭐ 実機体感で「札と主人公が重なって見えなくなる」。実測すると **構造的に必ず重なる**:
         札はノード中心に置かれ (translate(-50%,-50%))、主人公も同じノードに立つ。
         desktop 実測 = 拠点 7 つとも 96 x 30.2px (96px セル面積の 31.5%) が隠れ、
         初期位置 pier では隣の phlan の札に 63 x 47px (32.1%) 食われていた。
       ⭐⭐⭐ 解き方 = **当たり判定はノードに残し、羊皮紙だけを子要素として頭上へ逃がす**。
         ドライバはこの分離を最初から想定している:
           (7d)      … 「札の中心」を **札自身の矩形**から採る (ノード座標ではない)
           (7c-1/2/3)… 札どうし / 集落 / 港町との間隔は **ノード座標**で測る → 不動
           (1a)      … 水率も **ノード + エッジ**で測る → 不動
         ⛔ したがって守るべきは 2 つだけ: 札が **画面内 (onScreen)** に居ること、
            札が **.worldNode の子孫 (self)** のままであること。
       ⚠ site の当たり判定は way と同じ 44px 角へ戻す (以前は width/height:auto = 札の箱)。
         clientFromNode はノード中心を押すので、ここに実体が要る。 */
    .worldNode-site .worldNodeBody {
      width: 17px; height: 17px;            /* ⭐ 2026-09-02: 中継点を 13px へ上げたので、拠点も比例で上げて
                                               「点線 6 / 止まれる 13 / 拠点 17」の 3 段を保つ。
                                               ⛔ 当たり判定 (.worldNode 44px 角) は不動 = (3b)(7d) に波及しない。 */
      border-radius: 50%;
      /* ⭐ **中心の暗い点** (2026-08-26)。実機体感の症状は「拠点マーカーが街道の中継点を
           一回り大きくしただけに見える」で、原因は --route-ink がクリームなので
           拠点も中継点も **ただの明るい塊**にしか見えないこと。
         ⭐⭐ だから差を「大きさ / 明るさ」ではなく **中身があるか**で付ける
           (中継点 .worldNode-way は塗りつぶし ●、拠点は中心が抜けた ◎)。
         ⚠ 芯の色は札のインク --wsp-ink と同じ #2e2113 = 地図のトンマナを 1 系統に保つ。
         ⚠⚠ **未解放の拠点は .worldNode-way を着る** (buildNodes の className を参照) ので、
           ここをどれだけ変えても未解放側には波及しない。むしろ「明るい塊 = ただの街道の
           折れ目」という読みが強まるので、隠していることはバレにくくなる。 */
      background: radial-gradient(circle at 50% 50%,
                    #2e2113 0, #2e2113 3.6px, var(--route-ink) 4.3px, var(--route-ink) 100%);
      box-shadow: 0 0 0 3px rgba(238,222,182,0.92), 0 0 0 4px rgba(20,14,6,0.9), 0 2px 6px rgba(0,0,0,0.7);
    }
    /* ── 自キャラの ▽ (依頼書 #43) ──────────────────────────────────────
       ⭐ 見た目は town.html の #townHeroMark / index.html の #heroMark と **同じ**
         (border 三角 / #ffd24a / 同じ bob)。⛔ 絵文字 ▽ や文字で描かない
         —— ステージの scale(zoom) の中に居るので、文字だと輪郭が崩れる。
       ⚠⚠ pointer-events: none が必須。#worldHero と同じ理由 (依頼書 §2-6)。
         付け忘れると verify_world_map (7d)(3b)(3c) / verify_world_steps (2c)(2d) /
         verify_quest_walk (3e) の 5 本が壊れる。
       ⚠ z-index 6 = 主人公 (5) の 1 つ上・タイトル帯 (10) の下。
         ⛔ town.html の 5 を写経しない —— 街は「主人公 3 < 札 4 < ▽ 5」だが、
            世界地図は「刻み点 3 < 札 4 < 主人公 5」で **並びが違う** (依頼書 §2-4)。
       ⚠ --hm-w / --hm-h は JS の HM_W / HM_H と一致させること
         (装置 assert (0b) が実描画の矩形と突き合わせて写経ミスを殺す)。 */
    #worldHeroMark {
      --hm-w: 9px;        /* 三角の半幅 (JS の HM_W と一致) */
      --hm-h: 13px;       /* 三角の高さ (JS の HM_H と一致) */
      --hm-color: #ffd24a;
      position: absolute;
      width: 0; height: 0;
      border-left: var(--hm-w) solid transparent;
      border-right: var(--hm-w) solid transparent;
      border-top: var(--hm-h) solid var(--hm-color);
      filter: drop-shadow(0 0 2px #000) drop-shadow(0 2px 3px rgba(0,0,0,0.8));
      pointer-events: none;
      z-index: 6;
      animation: heroMarkBob 1.2s ease-in-out infinite;
    }
    @keyframes heroMarkBob { 0%, 100% { margin-top: 0; } 50% { margin-top: 4px; } }
    .worldSign {
      /* ⭐ 札は当たり判定 (44px 角) の **上** へ出す。G = 76px は実測から導いた:
           主人公の上端はノードから -89.3px (96px セル x 接地比 0.93)、親の上端は -22px
           → G >= 89.3 - 22 = 67.3。余白 8px を足して 76px (札の下端 = ノードから -98px)。
         ⛔ margin-left/-top では可変幅の中心を出せない (#15 の実測)。中心は translateX(-50%)。 */
      position: absolute;
      left: 50%; bottom: calc(100% + 76px);
      transform: translateX(-50%);
      transition: transform 0.12s ease;
      --wsp-paper-img: url("assets/parchment_plaza.jpg");
      /* ⭐ 明るいクリームの薄掛け。紙のまだら模様に細い書体が食われるのを防ぐ (#15)。 */
      --wsp-wash: 0.34;
      --wsp-ink: #2e2113;
      --wsp-ink-soft: #4a3413;
      padding: 5px 12px 6px;
      border: 1px solid rgba(120,86,44,0.85);
      border-radius: 2px;
      background-image: linear-gradient(rgba(246,232,198,var(--wsp-wash)), rgba(246,232,198,var(--wsp-wash))),
                        var(--wsp-paper-img);
      background-size: auto, cover;
      background-position: center, center;
      background-color: #efe0bd;              /* 紙が届く前の下敷き (文字が浮かないように) */
      box-shadow: 0 2px 8px rgba(0,0,0,0.6), inset 0 0 18px rgba(120,80,30,0.25);
      white-space: nowrap; text-align: center;
      font-family: 'MedievalSharp', 'Cinzel', serif;
      color: var(--wsp-ink);
    }
    .worldSignName {
      display: block;
      font-size: 15px; line-height: 1.25; letter-spacing: 0.04em;
      color: var(--wsp-ink);
      pointer-events: none;
    }
    .worldSignDesc {
      display: block; margin-top: 1px;
      font-size: 11px; line-height: 1.3;
      color: var(--wsp-ink-soft);
      pointer-events: none;
    }
    body.compact .worldSignName { font-size: 14px; }
    body.compact .worldSignDesc { font-size: 10px; }

    /* ── 画面上の帯 ─────────────────────────────────────────────────── */
    #worldTitle {
      position: fixed; left: 0; right: 0; top: 0;
      padding: 10px 14px calc(10px + env(safe-area-inset-top, 0px));
      text-align: center;
      font-family: 'MedievalSharp', 'Cinzel', serif;
      font-size: 20px; letter-spacing: 0.08em;
      color: #f0dca8;
      text-shadow: 0 2px 6px #000, 0 0 12px #000;
      background: linear-gradient(to bottom, rgba(10,8,5,0.72), rgba(10,8,5,0));
      pointer-events: none;                   /* ⚠ 帯の下のノードが押せなくなるのを防ぐ */
      z-index: 10;
    }
    #worldTitle small {
      display: block; margin-top: 2px;
      font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0;
      color: #cbb98c;
    }
    body.compact #worldTitle { font-size: 16px; }

    /* ── 入場の確認ダイアログ (依頼書 #23 §6-3) ──────────────────────────
       ⚠⚠ **既定は display:none。** visibility:hidden にすると (3e) / #21 の (7d) の
         elementFromPoint がこの要素に食われて 札 7 枚とも赤くなる
         (#15 の town.html で踏んだ罠と同型 = 負のコントロール asktop の再現対象)。
       ⛔ 配色・寸法・文字サイズは受入条件で縛られていない (依頼書 §8「測らないこと」)。
         .worldSign と同じトンマナ (羊皮紙 + 焦茶のインク) に合わせてある。
       ⭐ ここは #worldStage の scale(zoom) の **外** (position: fixed) なので、札と違って
         文字が zoom で縮まない = 書いた px がそのまま実効サイズ (依頼書 §9-5 の読みやすさ)。 */
    #worldEnterAsk { display: none; position: fixed; inset: 0; z-index: 20;
      align-items: center; justify-content: center; background: rgba(8,6,4,0.62); }
    #worldEnterAsk.show { display: flex; }
    #worldEnterBox {
      max-width: min(86vw, 420px);
      padding: 20px 24px 18px;
      border: 1px solid rgba(120,86,44,0.9);
      border-radius: 3px;
      /* ⭐ 明るいクリームの薄掛け + 羊皮紙。⛔ opacity で薄めない (紙の斑に文字が食われる)。 */
      background-image: linear-gradient(rgba(246,232,198,0.34), rgba(246,232,198,0.34)),
                        url("assets/parchment_plaza.jpg");
      background-size: auto, cover;
      background-position: center, center;
      background-color: #efe0bd;
      box-shadow: 0 8px 28px rgba(0,0,0,0.75), inset 0 0 26px rgba(120,80,30,0.28);
      text-align: center;
      font-family: 'MedievalSharp', 'Cinzel', serif;
      color: #2e2113;
    }
    #worldEnterText { font-size: 20px; line-height: 1.45; letter-spacing: 0.03em; }
    #worldEnterBtns { margin-top: 18px; display: flex; gap: 14px; justify-content: center; }
    #worldEnterBtns button {
      flex: 0 0 auto; min-width: 104px;
      padding: 10px 18px;
      border: 1px solid rgba(70,48,20,0.9);
      border-radius: 2px;
      font-family: 'MedievalSharp', 'Cinzel', serif;
      font-size: 17px; letter-spacing: 0.05em;
      cursor: pointer;
      color: #f4e6c4;
      background: linear-gradient(to bottom, #6b4c22, #402c12);
      box-shadow: 0 2px 6px rgba(0,0,0,0.55);
    }
    #worldEnterNo { background: linear-gradient(to bottom, #514639, #2c251d); }
    #worldEnterBtns button:hover { filter: brightness(1.16); }
    /* ⚠ compact (iPhone) でも読める大きさを保つ (依頼書 §9-5)。 */
    body.compact #worldEnterText { font-size: 18px; }
    body.compact #worldEnterBtns button { font-size: 16px; min-width: 96px; padding: 11px 16px; }
  </style>
</head>
<body>
  <div id="worldBackdrop"></div>
  <div id="worldViewport">
    <div id="worldStage">
      <img id="worldBg" src="assets/world_region.jpg" alt="" draggable="false">
      <svg id="worldRoutes" xmlns="http://www.w3.org/2000/svg"><g id="worldRouteInk"></g></svg>
      <div id="worldGoal"></div>
      <div id="worldHeroShadow"></div>
      <div id="worldHero"></div>
      <div id="worldHeroMark"></div>
      <!-- .worldNode はここへ JS が並べる -->
    </div>
  </div>

  <div id="worldTitle">地方全景
    <small>行き先をタップ / 街道の点線をたどって歩く</small>
  </div>

  <!-- 入場の確認 (依頼書 #23 §6-3)。⛔ 文言はここに書かない —— 地名の唯一の正は
       js/world-map.js の label で、JS が読んで #worldEnterText へ流し込む。
       ⚠ 既定は CSS の display:none (上の #worldEnterAsk)。開くのは .show を付けたときだけ。 -->
  <div id="worldEnterAsk" aria-hidden="true">
    <div id="worldEnterBox">
      <div id="worldEnterText"></div>
      <div id="worldEnterBtns">
        <button type="button" id="worldEnterYes">入る</button>
        <button type="button" id="worldEnterNo">やめる</button>
      </div>
    </div>
  </div>

  <script src="js/abilities.js"></script><!-- D&D 5e 6能力値の唯一の正 (#28)。5ページ全部が読む。⚠ js/skill-check.js より前。撤退 ?ability5e=0 -->
  <script src="js/save-slots.js"></script>
  <script src="js/hero-classes.js"></script>
  <script src="js/player-sheet.js"></script><!-- プレイヤーシート v1 (#29)。5ページ共通。⚠ js/abilities.js より後。撤退 ?sheet=0 -->
  <script src="js/world-map.js"></script>
  <script src="audio.js"></script>
  <script>
  (function () {
    "use strict";

    /* ══ 撤退スイッチ ?world=0 (依頼書 §7) ═══════════════════════════════
       ワールドマップを丸ごと素通りし、今日とまったく同じ「タイトル → 街」に戻す。
       ⚠⚠ **描画より前に判定して return する。** 後ろに置くと撤退したはずの地図が一瞬見える
         (town.html:318 が ?town=0 を IIFE の先頭で判定したのと同じ理由)。
       ⚠ クエリはページ遷移をまたがないので、**見た時点で sessionStorage へ写して**全ページで読む
         (?town=0 とまったく同じ形。写しではなく同じ作法を使う)。
       ⛔ **?town=0 とは独立**。相乗りさせると赤が出たときどちらの撤退か切り分けられない。
       ⚠ location.href ではなく **replace**。href だと履歴に world.html が残り、
         街で「戻る」を押した人が撤退したはずの地図へ戻ってしまう。 */
    var WORLD_OFF_KEY = "dragonfighters.worldOff";
    try {
      if (new URLSearchParams(location.search).get("world") === "0") {
        sessionStorage.setItem(WORLD_OFF_KEY, "1");
      }
    } catch (e) {}
    var worldOff = false;
    try { worldOff = sessionStorage.getItem(WORLD_OFF_KEY) === "1"; } catch (e) { worldOff = false; }
    if (worldOff) { location.replace("town.html"); return; }

    /* ══ 撤退スイッチ ?heromark=0 (依頼書 #43 §7) ═══════════════════════════
       ⚠ index.html:6204 / town.html:425 と **同名**だが、読むのは各ページが独立。
         クエリはページ遷移をまたがない = それが仕様 (#15 §7 が明示的に了承済み)。
       ⛔ sessionStorage へ写さない (?world=0 / ?walkstep=0 の型ではない —— あちらは
          遷移をまたぐ必要があるから写しているだけで、▽ はページ内で完結する)。
       ⛔ ?world=0 / ?questwalk=0 / ?walkstep=0 と相乗りさせない。 */
    var HERO_MARK_ON = true;
    try {
      if (new URLSearchParams(location.search).get("heromark") === "0") HERO_MARK_ON = false;
    } catch (e) {}

    var WM = window.WORLD_MAP;
    if (!WM) { location.replace("town.html"); return; }   // 保険: データが無ければ街へ

    var MAP_W = WM.W, MAP_H = WM.H;            // 1536 x 1024 (js/world-map.js が唯一の正)
    var NODES = WM.NODES, EDGES = WM.EDGES;
    var SPRITE = 96;                           // 歩行シートのセル
    var FOOT = 0.93;                           // ★接地比 (town.html / index.html と同じ実測値)
    var SHEET_ROW_RIGHT = 3;                   // ★右向きの行 (index.html updateKnightSprite と同じ)
    /* ▽ の幾何 (依頼書 #43 §2-3)。⭐ HEAD_TOP は 6 職の <class>_walk.png row3 を実測した
       「96px セル上端 → 頭の天辺」の最小値。2026-09-03 再測 = warrior 32 / dwarf 32 /
       elf 33 / cleric 34 / mage 32 / rogue 32 → 32 (town.html:499 と同じ値)。
       ⚠⚠ FOOT=0.93 は **足元** の話。頭の位置はこれとは別に測らないと ▽ が頭から浮く。
       ⭐⭐⭐ HM_GAP + HM_H (= 21) < HEAD_TOP (= 32) である限り、▽ は主人公の 96px セルの
         **内側** に収まる (余白 11px)。これが verify_world_map の (7f)「駒が札を 10% 以上
         隠さない」を ▽ にも自動で効かせている **唯一の根拠** (依頼書 §2-2)。
         ⛔ この不等式を崩さない。崩すと (7f) は永久に気づかないまま札が隠れる。 */
    var HEAD_TOP = 32, HM_GAP = 8, HM_W = 9, HM_H = 13;

    var SVG_NS = "http://www.w3.org/2000/svg";

    var elViewport = document.getElementById("worldViewport");
    var elStage    = document.getElementById("worldStage");
    var elRoutes   = document.getElementById("worldRoutes");
    var elInk      = document.getElementById("worldRouteInk");
    var elHero     = document.getElementById("worldHero");
    var elMark     = document.getElementById("worldHeroMark");
    if (!HERO_MARK_ON && elMark) { elMark.remove(); elMark = null; }
    var elShadow   = document.getElementById("worldHeroShadow");
    var elGoal     = document.getElementById("worldGoal");
    /* ⭐ 入場の確認ダイアログ (依頼書 #23 §6-3)。⛔ 既定は display:none = (3e) の番人。 */
    var elAsk      = document.getElementById("worldEnterAsk");
    var elAskText  = document.getElementById("worldEnterText");
    var elAskYes   = document.getElementById("worldEnterYes");
    var elAskNo    = document.getElementById("worldEnterNo");

    elStage.style.width  = MAP_W + "px";
    elStage.style.height = MAP_H + "px";

    /* ══ compact 判定 ═══════════════════════════════════════════════════
       ⚠ town.html:385 / tavern.html:2020 と **同じ 3 条件**。写しを作らず同じ式を使う。 */
    function isCompact() {
      try {
        return window.matchMedia('(max-width: 560px)').matches
            || window.matchMedia('(max-height: 480px)').matches
            || window.matchMedia('(hover: none)').matches;
      } catch (e) { return false; }
    }

    /* ══ ルート (点線) ══════════════════════════════════════════════════
       ⭐⭐⭐ **「ノード座標 → 線の端点」を計算しているのは、この関数ただ 1 つ。**
         ⛔ 2 箇所目を作らない。散らすと負のコントロール maskdrift の変異アンカーが
            複数ヒットして exit 3 になる (依頼書 §8 / #20 で実測)。
         ⚠ 行を整形し直さないこと (1 行まるごとがアンカー)。 */
    function edgeEnds(a, b) { return { x1: a.x, y1: a.y, x2: b.x, y2: b.y }; }

    function buildRoutes() {
      elRoutes.setAttribute("width", MAP_W);
      elRoutes.setAttribute("height", MAP_H);
      elRoutes.setAttribute("viewBox", "0 0 " + MAP_W + " " + MAP_H);
      for (var i = 0; i < EDGES.length; i++) {
        var e = EDGES[i], a = NODES[e[0]], b = NODES[e[1]];
        if (!a || !b) continue;                /* データ側が壊れていたら (0a)/(3a) が拾う */
        var p = edgeEnds(a, b);
        var ln = document.createElementNS(SVG_NS, "line");
        ln.setAttribute("class", "worldRouteLine");
        ln.setAttribute("data-edge", e[0] + "__" + e[1]);
        ln.setAttribute("x1", p.x1); ln.setAttribute("y1", p.y1);
        ln.setAttribute("x2", p.x2); ln.setAttribute("y2", p.y2);
        elInk.appendChild(ln);
      }
    }
    buildRoutes();

    /* ══ 主人公 ═════════════════════════════════════════════════════════ */
    function heroClassKey() {
      var key = null;
      try {
        var pc = JSON.parse(localStorage.getItem("dragonfighters.partyComposition") || "[]");
        if (Array.isArray(pc) && typeof pc[0] === "string") key = pc[0];
      } catch (e) {}
      /* ⚠ 知らないクラスキーで <class>_walk.png を引くと 404 になって主人公が消える。 */
      var known = (window.HERO_CLASSES || []).map(function (c) { return c.classKey; });
      if (!key || (known.length && known.indexOf(key) < 0)) key = "warrior";
      return key;
    }
    var HERO_CLASS = heroClassKey();
    elHero.style.backgroundImage = 'url("assets/' + HERO_CLASS + '_walk.png")';

    /* ══ 立ち位置 ═══════════════════════════════════════════════════════
       規則は 1 本: **ワールドマップに出るときは、直前に居た場所に立つ。**

         | 入口                 | 判定                  | 湧く場所               |
         |----------------------|-----------------------|------------------------|
         | キャラ選択の後       | exitVia が無い        | pier (船で上陸した所)  |
         | ダンジョンからの帰還 | exitVia === "dungeon" | SITES[currentScenario] |
         | 未知の値 / 欠損      | —                     | phlan (fail-safe)      |

       ⛔⛔⛔ **一回性のキーを 1 つも消さない (依頼書 §2-2 の罠 A)。読むだけ = peek。**
         このページが removeItem を呼ぶと、下の 3 つが**黙って**壊れる:
           dragonfighters.exitVia    … 消費するのは town.html:414。消すと帰還先が
                                       必ず酒場前 (10,3) に落ちる = **一見正しく見える**
           dragonfighters.enterVia   … 消費するのは tavern.html:1867
           dragonfighters.lastResult … 消費するのは tavern.html:4121。
                                       消すと**酒場のリザルト画面が出なくなる**
         ⭐ enterVia / lastResult は getItem すら**しない**のが一番安全。
           このファイルでは名前が**この注意書きの中にしか出てこない**ので、
           `grep -n 'enterVia\|lastResult' world.html` が全部コメント行を返すことが担保になる
           (実行される行に 1 つでも出たら、それは触っている証拠)。
       ⭐ dragonfighters.currentScenario は removeItem が全文 grep で 0 件なので peek でよい。 */
    var EXIT_VIA_KEY = "dragonfighters.exitVia";
    var SCENARIO_KEY = "dragonfighters.currentScenario";
    /* ⚠ 名前のとおり **読むだけ**。⛔ この関数に removeItem を足さないこと。 */
    function peekSession(key) {
      try { return sessionStorage.getItem(key); } catch (e) { return null; }
    }
    var exitVia = peekSession(EXIT_VIA_KEY);   /* ⛔ peek のみ。消費するのは town.html */
    var scenarioId = peekSession(SCENARIO_KEY);
    /* ⚠ 「キー自体が無い」= タイトルから来た。空文字も同じ扱いにする。
       それ以外の未知の値は js/world-map.js 側の fail-safe (phlan) へ落ちる。 */
    var spawnVia = (exitVia === null || exitVia === "") ? "title" : exitVia;
    var heroNodeId = WM.spawnFor(spawnVia, scenarioId);
    if (!WM.has(heroNodeId)) heroNodeId = "phlan";
    var heroPx = { x: NODES[heroNodeId].x, y: NODES[heroNodeId].y };
    var facingLeft = false;

    /* ══ 描画 ═══════════════════════════════════════════════════════════ */
    var frame = 0, moving = false;
    function placeHero(cx, cy) {
      /* ⭐ 足元をノード座標に置く (town.html の「足元をタイル中心に置く」の読み替え) */
      elHero.style.left = (cx - SPRITE / 2) + "px";
      elHero.style.top  = (cy - SPRITE * FOOT) + "px";
      elHero.style.transform = facingLeft ? "scaleX(-1)" : "none";
      elHero.style.backgroundPosition = (-frame * SPRITE) + "px " + (-SHEET_ROW_RIGHT * SPRITE) + "px";
      elShadow.style.left = cx + "px";
      elShadow.style.top  = cy + "px";
      /* ⭐ ▽ の位置の出所は **placeHero のこの 2 行だけ** (town.html:526 と同じ規則)。
         別の場所からも書くと「歩くと ▽ だけ取り残される」が静かに起きる。
         三角は width:0 の border 三角なので、**見た目の中心は left + HM_W**。 */
      if (elMark) {
        elMark.style.left = (cx - HM_W) + "px";
        elMark.style.top  = (cy - SPRITE * FOOT + HEAD_TOP - HM_GAP - HM_H) + "px";
      }
    }
    placeHero(heroPx.x, heroPx.y);

    /* ══ カメラ ═════════════════════════════════════════════════════════
       ⚠⚠ 母集団は画面の向きでも割れる。デスクトップ横長と compact 縦の**両方**で測ること。 */
    var zoom = 1, camX = 0, camY = 0;
    /* 可視域 = 画面から上下の帯を引いた残り。
       ⚠⚠ 帯の高さを引かずに中央へ寄せると、拠点の札がタイトル帯の下に潜る (town.html で実測)。
       ⚠ #worldHud はまだ無い (後続項目が compact 用の帯を足すならここが読み口)。 */
    function insets() {
      var elTitle = document.getElementById("worldTitle");
      var elHud   = document.getElementById("worldHud");
      var top = elTitle ? elTitle.offsetHeight : 0;
      var bottom = 0;
      if (elHud && elHud.offsetHeight > 0) {
        try { if (getComputedStyle(elHud).display !== "none") bottom = elHud.offsetHeight; } catch (e) {}
      }
      return { top: top, bottom: bottom };
    }
    function layout() {
      var compact = isCompact();
      document.body.classList.toggle("compact", compact);
      var vw = elViewport.clientWidth, vh = elViewport.clientHeight;
      var ins = insets();
      var avail = Math.max(120, vh - ins.top - ins.bottom);
      if (compact) {
        /* ⭐ compact は「全体を入れる」ではなく **可視域を満たす** 倍率。
           1536x1024 を縦長の画面へ収めると上下が真っ黒になり、しかも駒が豆粒になる
           (390x844 で全体を入れると zoom 0.25 = 駒が実効 24px)。
           満たす倍率にしてカメラで追えば黒帯ゼロで駒が読める大きさになる。
           ⚠ 下限 0.42 は「極端に横長の compact (横持ち)」で寄りが足りなくなる保険
             (駒の実効 96*0.42 = 40px)。⚠ 上限 1.5 は寄りすぎ防止。 */
        zoom = Math.min(1.5, Math.max(vw / MAP_W, avail / MAP_H, 0.42));
      } else {
        /* デスクトップ: 1536x1024 が **帯を除いた領域に** 全部入る倍率で固定。
           ⭐ 地図は全体が見えてこそなので、ここは切り取らない。
             アスペクト差ぶんの余りは #worldBackdrop (同じ地図のぼかし) が埋める。 */
        zoom = Math.min(vw / MAP_W, avail / MAP_H);
      }
      applyCamera();
    }
    function applyCamera() {
      var vw = elViewport.clientWidth, vh = elViewport.clientHeight;
      var ins = insets();
      var viewTop = ins.top, viewH = Math.max(120, vh - ins.top - ins.bottom);
      var sw = MAP_W * zoom, sh = MAP_H * zoom;
      if (sw <= vw) camX = (vw - sw) / 2;
      else camX = Math.max(vw - sw, Math.min(0, vw / 2 - heroPx.x * zoom));
      if (sh <= viewH) camY = viewTop + (viewH - sh) / 2;
      else camY = Math.max(viewTop + viewH - sh, Math.min(viewTop, viewTop + viewH / 2 - heroPx.y * zoom));
      elStage.style.transform = "translate(" + camX + "px," + camY + "px) scale(" + zoom + ")";
    }
    window.addEventListener("resize", layout);
    window.addEventListener("orientationchange", layout);

    /* ══ ノード ═════════════════════════════════════════════════════════
       ⭐ site の 7 つは .worldNodeBody が **足元の拠点マーカー**になり、
         羊皮紙の立て札 (.worldSign) は **el の 2 人目の子**として **頭上へ** 出る。
         当たり判定の要素 (.worldNode[data-node]) は**そのまま**なので、
         (3b) の「ノードをタップ → そこへ立つ」は測り続けられる。
       ⭐ 2026-08-26 (#23 §6-2): **未解放の拠点は札を出さず、中継点の点に化ける。**
         ⛔ ただし隠すのは **見た目だけ**。当たり判定 (.worldNode[data-node] 44px 角) も
            EDGES も findPath も 1 バイトも変えない。
         ⚠⚠⚠ 依頼書 §2-2 の罠 A (2026-08-26 に再実測して実在を確認): 未解放 5 拠点
            (forest / swamp / fort / temple / dragon) を EDGES から外すと、phlan から届くのは
            phlan / pier / cross_n の 3 つだけになり **廃坑へ到達できず開始直後に詰む**。
            街道網は環状なので単体テストは永久に緑になる。→ だから歩ける道は触らない。 */

    /* ══ 解放状態 (依頼書 #23 §2-5 / §6-1) ══════════════════════════════
       ⚠ 出所は localStorage の 1 キーだけ (tavern.html の PROGRESS_KEY と同じ)。写しを作らない。
       ⚠ 鎖 (UNLOCK) の解釈も js/world-map.js の isRevealed ただ 1 つ。⛔ ここへ写経しない。
       ⚠ ?questwalk=0 のときは「今日どおり」= 全部見せる。
       ⛔ ?world=0 とは独立 (相乗りさせると赤が出たときどちらの撤退か切り分けられない)。 */
    var QUEST_WALK_OFF_KEY = "dragonfighters.questWalkOff";
    try {
      if (new URLSearchParams(location.search).get("questwalk") === "0") {
        sessionStorage.setItem(QUEST_WALK_OFF_KEY, "1");
      }
    } catch (e) {}
    var questWalkOff = false;
    try { questWalkOff = sessionStorage.getItem(QUEST_WALK_OFF_KEY) === "1"; } catch (e) {}

    var clearedList = [];
    try { clearedList = JSON.parse(localStorage.getItem("dragonfighters.cleared") || "[]"); } catch (e) { clearedList = []; }
    if (!Array.isArray(clearedList)) clearedList = [];

    /* ⭐ 受注中の依頼。⛔ ここでは消費しない (入場の直前に 1 回だけ消す)。
       ⚠⚠⚠ exitVia / enterVia / lastResult とは別物。あちらは 1 バイトも触らない。 */
    var questDest = null;
    try { questDest = sessionStorage.getItem("dragonfighters.questDest"); } catch (e) {}

    /* このノードの札を出すか。⭐ 拠点でない中継点は常に true (元から札が無いので影響しない)。 */
    function isNodeRevealed(id) {
      if (questWalkOff) return true;
      var sc = WM.scenarioOfNode(id);
      if (!sc) return true;                 /* phlan は SITES に居ないので常に見える */
      return WM.isRevealed(sc, clearedList);
    }

    /* ══ 撤退スイッチ ?walkstep=0 (#40 §7) ═══════════════════════
       ⭐ 立てると「今日の姿」= 刻み点マーカーを 1 枚も描かず、1 タップで経路全部を歩く。
       ⚠ **buildSteps() より前**に読むこと (下の buildSteps が walkStepOff を見る)。
       ⛔ ?world=0 / ?questwalk=0 と相乗りさせない
         (赤が出たときどちらの撤退か切り分けられなくなる)。
       ⚠ 遷移をまたぐ = sessionStorage へ写す。酒場 → 出発 → world の導線は
         クエリを持ち越せない (#12 の確定作法「遷移先にクエリを足さない」)。
       ⭐⭐⭐ 撤退しても WORLD_MAP.STEPS のデータ自体は消さない。
         戻すのは「描画」と「1 ホップ制限」だけ ((6d) がこれを測る)。 */
    var WALK_STEP_OFF_KEY = "dragonfighters.walkStepOff";
    try {
      if (new URLSearchParams(location.search).get("walkstep") === "0") {
        sessionStorage.setItem(WALK_STEP_OFF_KEY, "1");
      }
    } catch (e) {}
    var walkStepOff = false;
    try { walkStepOff = sessionStorage.getItem(WALK_STEP_OFF_KEY) === "1"; } catch (e) {}

    var nodeEls = {};
    function buildNodes() {
      Object.keys(NODES).forEach(function (id) {
        var n = NODES[id];
        var el = document.createElement("div");
        /* ⭐ 未解放の拠点は way と同じ体裁 = 「街道の折れ目」に見えるだけ (依頼書 §6-2)。
           ⛔ data-node / data-kind と 44px 角の当たり判定は **変えない** (罠 A)。 */
        var shown = isNodeRevealed(id);
        el.className = "worldNode worldNode-" + (n.kind === "site" && shown ? "site" : "way");
        el.id = "worldNode_" + id;
        el.setAttribute("data-node", id);
        el.setAttribute("data-kind", n.kind);
        /* ⛔ 文言をここに写さない。label / desc の唯一の正は js/world-map.js。
           ⛔ 未解放では title 属性も付けない (hover で地名が漏れる)。 */
        if (n.label && shown) el.title = n.label;
        var body = document.createElement("span");
        body.className = "worldNodeBody";
        el.appendChild(body);
        if (n.kind === "site" && shown) {
          /* ⭐ 拠点 = 足元の拠点マーカー (上で作った body) + **頭上の**羊皮紙の立て札。
             ⭐⭐ 札は body の中身ではなく **el の 2 人目の子**。こうすると札を頭上へ
               逃がしても el.contains(sign) が真のまま = (7d) の「自分自身か子孫」も、
               clientFromNode (ノード中心) を押す (3b)/(7e) も両方生き残る。
             ⛔ 文言をここで作らない。label / desc を **そのまま textContent へ流し込むだけ**
               (唯一の正は js/world-map.js の 1 箇所。さらに上流は tavern.html の place:)。 */
          var sign = document.createElement("span");
          sign.className = "worldSign";
          /* ⭐ ノード別の札オフセット (唯一の正は js/world-map.js の signDx)。
               中心出しは CSS の translateX(-50%) が担うので、**アンカーの left そのもの**を
               ずらす。こうすると :hover の transform (translateX(-50%) scale(1.05)) と
               干渉しない。⛔ margin-left で書かない — #15 の「可変幅は margin では中心が
               出ない」と同じ土俵に見えて後で読み違える。
             ⚠ calc は "50% + -72px" が**構文エラー**になる。符号を文字列側へ畳むこと。 */
          if (typeof n.signDx === "number" && n.signDx !== 0) {
            sign.style.left = "calc(50% " + (n.signDx < 0 ? "- " + Math.abs(n.signDx) : "+ " + n.signDx) + "px)";
          }
          var nm = document.createElement("span");
          nm.className = "worldSignName";
          nm.textContent = n.label || id;
          sign.appendChild(nm);
          if (n.desc) {
            var ds = document.createElement("span");
            ds.className = "worldSignDesc";
            ds.textContent = n.desc;
            sign.appendChild(ds);
          }
          el.appendChild(sign);
        }
        el.style.left = n.x + "px";
        el.style.top  = n.y + "px";
        el.addEventListener("click", function (ev) { ev.stopPropagation(); goToNode(id); });
        elStage.appendChild(el);
        nodeEls[id] = el;
      });
    }
    buildNodes();

    /* ══ 歩みの刻みのマーカー (#40 §5-2) ══════════════════════
       ⭐⭐⭐ 座標は **WORLD_MAP.STEPS から引く**。⛔ world.html 側に写しを作らない
         (js/world-map.js が唯一の正。2 つ持つと必ずズレる = 変異 handcoord の対象)。
       ⛔ nodeEls へ入れない (__world.nodeIds() が汚れる)。読み窓は stepIds() を別に持つ。
       ⛔ 点線 SVG (#worldRoutes) の子にしない — あちらは pointer-events: none なので
         押せなくなり、さらに (2b)「<line> は EDGES.length 本のまま」が崩れる
         (依頼書 §2-3 の罠 B)。 */
    var STEPS = WM.STEPS || {};
    var stepEls = {};
    function buildSteps() {
      if (walkStepOff) return;                /* 撤退時は 1 枚も描かない (§7) */
      Object.keys(STEPS).forEach(function (id) {
        var s = STEPS[id];
        var el = document.createElement("div");
        el.className = "worldStep";           /* ⛔ .worldNode を足さない (依頼書 §2-4) */
        el.id = "worldStep_" + id;
        el.setAttribute("data-step", id);
        var body = document.createElement("span");
        body.className = "worldStepBody";
        el.appendChild(body);
        el.style.left = s.x + "px";
        el.style.top  = s.y + "px";
        el.addEventListener("click", function (ev) { ev.stopPropagation(); goToPoint(id); });
        elStage.appendChild(el);
        stepEls[id] = el;
      });
    }
    buildSteps();

    /* ══ 移動 ═══════════════════════════════════════════════════════════
       ⭐ 経路は WORLD_MAP.findPath が出したノード列だけを辿り、エッジ上は線形補間。
       ⛔ 線の無いところをタップしても動かない → viewport に click ハンドラを置かない
         (依頼書 §6-3。隣接まで寄せる救済も入れない)。 */
    /* ⭐ 2026-08-25 実機体感で「速い」→ 半分へ (0.36 → 0.18)。
       ⚠ 街 town.html の MS_PER_TILE と **対で揃える**。片方だけ変えると町と地図で歩き方が食い違う。
       ⭐ ここのコマ送りは下の PX_PER_FRAME による **距離基準**なので、速度を変えれば足の回りも
         自動で追従する (⛔ town.html は時間基準でこの理屈が通らない。あちらは周期も一緒に動かす)。 */
    var PX_PER_MS = 0.18;                      /* 街の 64px/340ms = 0.188 px/ms とほぼ同じ体感 */
    var PX_PER_FRAME = 34;                     /* 歩行アニメの 1 コマぶんの距離 */
    var walkTimer = null, pendingArrive = null;

    function stopWalk() {
      if (walkTimer) { cancelAnimationFrame(walkTimer); walkTimer = null; }
      moving = false; frame = 0;
      placeHero(heroPx.x, heroPx.y);
    }

    function walkPath(ids, onArrive) {
      stopWalk();
      pendingArrive = onArrive || null;
      if (!ids || !ids.length) {
        if (pendingArrive) { var f0 = pendingArrive; pendingArrive = null; f0(); }
        return;
      }
      /* ⭐⭐⭐ 座標は **細分化グラフ (NODES ∪ STEPS)** から引く (#40)。
         ⚠⚠⚠ ここを NODES のままにすると、刻み点 id を渡された瞬間に
           NODES["lake_n__lakeside@1"] が undefined になり .x で TypeError で落ちる。
         ⛔ 下の step() (rAF) の中で walkNodes() を呼ばないこと —
           毎フレーム全ノードを組み直すことになる。**先頭で 1 回だけ**組んで持つ。 */
      var G = WM.walkNodes();
      var idx = 0;
      var from = { x: heroPx.x, y: heroPx.y };
      var to = { x: G[ids[0]].x, y: G[ids[0]].y };
      var t0 = performance.now(), walked = 0;
      moving = true;
      if (to.x !== from.x) facingLeft = (to.x < from.x);
      function step(now) {
        var span = Math.max(1, Math.sqrt((to.x - from.x) * (to.x - from.x) + (to.y - from.y) * (to.y - from.y)));
        var t = Math.min(1, (now - t0) * PX_PER_MS / span);
        heroPx.x = from.x + (to.x - from.x) * t;
        heroPx.y = from.y + (to.y - from.y) * t;
        frame = Math.floor((walked + span * t) / PX_PER_FRAME) % 6;
        placeHero(heroPx.x, heroPx.y);
        applyCamera();
        if (t >= 1) {
          heroNodeId = ids[idx];
          heroPx.x = G[heroNodeId].x; heroPx.y = G[heroNodeId].y;
          walked += span;
          idx++;
          if (idx >= ids.length) {
            stopWalk();
            /* ⭐ 目印 (elGoal) を消すのは **呼び手 (goToPoint)** の役目 (#40)。
               1 タップ = 1 ホップなので、**最終目的地に着くまでは消さない**
               (「まだ着いていない」を目印が語る)。⛔ ここへ戻さないこと。
               ⚠ 撤退時 (walkStepOff) は 1 回で経路全部を歩くので今日どおり必ず消える。 */
            if (pendingArrive) { var fn = pendingArrive; pendingArrive = null; fn(); }
            return;
          }
          from = { x: heroPx.x, y: heroPx.y };
          to = { x: G[ids[idx]].x, y: G[ids[idx]].y };
          if (to.x !== from.x) facingLeft = (to.x < from.x);
          t0 = now;
        }
        walkTimer = requestAnimationFrame(step);
      }
      walkTimer = requestAnimationFrame(step);
    }

    /* ══ 到着 ═══════════════════════════════════════════════════════════
       ⭐ 遷移の書き口は **この 1 本だけ**。goToNode() の「同じノードをもう一度押した」枝も
         歩き終わりの枝も、どちらもここへ合流する。
       ⛔ **遷移先にクエリを足さない** (#6 / #12 の確定作法 / 受入条件 (3d) が
         location.search === "" を要求する)。行き先は NODES[id].enter そのまま。
       ⭐ 2026-08-26 (#23 §6-4): enter を持たない 6 つの拠点のうち **受注中の依頼の地だけ**が
         確認ダイアログを開いて index.html へ入れる。他は今までどおり歩いて着くだけ。 */
    function onArriveNode(id) {
      var n = NODES[id];
      if (!n) return;
      if (n.enter) { location.href = n.enter; return; }   /* 港町フランは今日どおり即入る */
      /* ⭐ 受注中の依頼の地だけが入れる。⛔ NODES に enter を足さない —
         行き先は「ページの静的な属性」ではなく「受注状態の関数」。
         ⚠ NODES へ enter を足すと verify_world_map.js の (7b-data)(7b-dom)
           「enter を持つのはただ 1 つ」と (5b) が赤くなる (依頼書 §2-6 / 変異 enterprop)。 */
      if (questWalkOff || !questDest) return;
      if (WM.scenarioOfNode(id) !== questDest) return;
      askEnter(id);
    }

    /* ══ 入場の確認 (依頼書 #23 §6-3 / §6-4) ═════════════════════════════
       ⚠ 押し口は click **と** touchend の 2 本。自動クローズを持たないダイアログなので、
         click 非発火端末だと閉じることも入ることもできなくなる (#5 で踏んだ罠)。
       ⭐ ハンドラは **1 回だけ**登録する。askEnter() の中で addEventListener すると
         開くたびに積み上がって同じ処理が何度も走る。
       ⭐ 二重発火 (touchend → 合成 click) は preventDefault と askBusy が吸う。 */
    var askNodeId = null, askBusy = false;
    function bindAsk(el, fn) {
      if (!el) return;
      var run = function (ev) {
        if (ev) { ev.preventDefault(); ev.stopPropagation(); }
        if (askBusy) return;
        fn();
      };
      el.addEventListener("click", run);
      el.addEventListener("touchend", run);
    }
    function closeAsk() {
      askNodeId = null;
      if (!elAsk) return;
      elAsk.classList.remove("show");
      elAsk.setAttribute("aria-hidden", "true");
    }
    bindAsk(elAskYes, function () {
      if (!askNodeId) return;
      askBusy = true;                        /* この後は遷移するだけ = 二重押しを殺す */
      /* ⭐ questDest を消費するのはこの 1 箇所だけ。⛔ exitVia / enterVia / lastResult /
         currentScenario / partyMembers には触れない (酒場と index が読む)。 */
      try { sessionStorage.removeItem("dragonfighters.questDest"); } catch (e) {}
      location.href = "index.html";          /* ⛔ クエリを足さない */
    });
    bindAsk(elAskNo, function () { closeAsk(); });

    function askEnter(id) {
      if (!elAsk || !elAskText) return;
      askNodeId = id;
      /* ⛔ 文言を写経しない。地名の唯一の正は js/world-map.js の label。 */
      elAskText.textContent = "〈" + (NODES[id].label || id) + "〉へ入りますか?";
      elAsk.classList.add("show");
      elAsk.setAttribute("aria-hidden", "false");
    }

    /* ══ 到着フック = ランダムイベントの器 (#40 §6-2) ═══════════════════
       ⭐ **器だけ**。⛔ ここでイベントを起こさない (後続チケットの担当。
         (4c) が「刻み点に着いても何も起きない」ことを機械で縛っている)。
       ⚠ 1 ホップ = **ちょうど 1 回**呼ぶ。⛔ walkPath の中から呼ばないこと —
         撤退時 (walkStepOff) は中継ノードを通過するので、そこで鳴らすと
         回数が合わなくなる (変異 arrivedup が縛る)。
       ⛔ lastArrival はゲームの状態を置く場所ではない。__world が読むための記録。 */
    var lastArrival = null, arrivalCount = 0;
    function onArriveStep(atId, destId) {
      arrivalCount++;
      lastArrival = { at: atId, dest: destId,
                      kind: WM.has(atId) ? "node" : "step",
                      arrived: atId === destId };
      /* ⭐ 拠点の入場判定は **今日のまま** = 「タップした行き先へ着いたとき」だけ鳴らす。
         ⚠⚠⚠ ここを `if (WM.has(atId))` だけにすると **通りすがりの拠点でも入場が起きる**。
           2026-09-01 実測: pier から forest を押すと 1 ホップ目が phlan (enter を持つ
           ただ 1 つのノード) なので location.href = "town.html" が走り、
           tools/verify_world_map.js が (fatal)「WORLD_MAP が undefined」で全滅した。
           ⭐ 今日の姿でも onArriveNode は **押した行き先でしか呼ばれていない**
             (walkPath は中継ノードで何も鳴らさない) ので、これが本当の「今日のまま」。
         ⛔ onArriveNode 自体は 1 バイトも変えていない。変えたのは **呼ぶ条件**だけ。
         ⛔ 通りすがりでイベントを起こさない ((4c) が縛る)。 */
      if (lastArrival.arrived && WM.has(atId)) onArriveNode(atId);
    }

    /* ══ 1 タップ = 経路上の「次の 1 点」まで (#40 §6-1) ══════════════════
       ⭐⭐⭐ 行き先は elGoal に残るので、同じ所を続けて押せば刻みながら着ける。
       ⛔ 「隣接だけ押せる」にはしない — **遠い拠点を押しても 1 ホップは必ず進む**
         ((3a)(3c) と負のコントロール hopnone が縛る)。
       ⚠ 撤退時 (walkStepOff) は **今日どおり経路全部**を 1 回で歩く。
       ⚠ 母集団は NODES ではなく **細分化グラフ (NODES ∪ STEPS)**。 */
    function goToPoint(id) {
      var G = WM.walkNodes();
      if (!Object.prototype.hasOwnProperty.call(G, id)) return false;
      if (id === heroNodeId && !moving) { onArriveNode(id); return true; }
      var path = walkStepOff ? WM.findPath(heroNodeId, id) : WM.findWalkPath(heroNodeId, id);
      if (path === null || path.length === 0) return false;   /* 到達できない先では動かない */
      var g = G[id];
      elGoal.style.left = g.x + "px"; elGoal.style.top = g.y + "px";
      elGoal.classList.add("show");
      var hop = walkStepOff ? path : path.slice(0, 1);      /* ★ ここが本チケットの核心 */
      var last = hop[hop.length - 1];
      walkPath(hop, function () {
        /* ⭐ 目印は「まだ着いていない」あいだ出したままにする。 */
        if (last === id) elGoal.classList.remove("show");
        onArriveStep(last, id);
      });
      return true;
    }
    /* ⛔ 既存の呼び名は残す (__world.goToNode をドライバが握っている)。 */
    function goToNode(id) { return goToPoint(id); }

    /* ══ 音 (依頼書 §6-2 の 6 / §12-1) ══════════════════════════════════
       BGM = GameAudio.playBgm("world") = assets/bgm/fierd.mp3 (魔王魂 / volume 0.48)。

       ⚠⚠ 呼び口は **2 本**。town.html / title.html とまったく同じ形にしてある。
         ① ロード時    … ブラウザはユーザー操作の外で音を出せないので、この 1 本は
                          audio.js の pendingBgm へ落ちるだけで**鳴らない**。
         ② 最初の pointerdown … unlock() が pendingBgm を拾って実際に鳴らす
                          (iOS Safari の音声解錠に必須)。
       ⚠⚠⚠ unlock() が鳴らす分は **モジュール内部の playBgm** を通る (audio.js の
         `if (pendingBgm) { … playBgm(p); }`) ので、GameAudio.playBgm を包んだスパイからは
         **永久に見えない**。だから検証は 2 経路 = 経路A (渡した ID) + 経路B
         (__bgmFileState() が実際に何を掴んで鳴らしているか) で測る (#20 で実測)。

       ⭐ 呼び口の実体を **playWorldBgm() ただ 1 つ**に畳んである。2 箇所へ同じ 1 行を
         書くと、負のコントロール silent の変異アンカーが 2 ヒットして exit 3 になる
         (#20 の title.html で実測した罠)。⛔ この関数を展開して 2 行に戻さないこと。 */
    var WORLD_BGM_ID = "world";
    function playWorldBgm() { try { if (window.GameAudio && GameAudio.playBgm) GameAudio.playBgm(WORLD_BGM_ID); } catch (e) {} }
    function bootAudio() {
      try { if (window.GameAudio && GameAudio.unlock) GameAudio.unlock(); } catch (e) {}
      playWorldBgm();
    }
    window.addEventListener("pointerdown", bootAudio, { once: true });
    playWorldBgm();   // ロード時 (未解錠なので pendingBgm へ落ちる)

    /* ══ 検証シーム ═════════════════════════════════════════════════════
       ⚠ classic script 直下の let/const/function は window に載らない。
         ドライバが読むものは明示的に載せる (town.html / title.html と同じ作法)。
       ⛔ ここにゲームの状態を足さないこと。読むための窓であって、状態の置き場ではない。 */
    window.__world = {
      heroNode:  function () { return heroNodeId; },
      heroPx:    function () { return { x: heroPx.x, y: heroPx.y }; },
      heroClass: function () { return HERO_CLASS; },
      /* ⚠ **読んだ値**であって消した値ではない。ドライバは (4a) でこの値と
         sessionStorage の実体の**両方**を見る (peek しているのに読めていない、を殺すため)。 */
      spawnVia:  function () { return { raw: exitVia, via: spawnVia, scenario: scenarioId }; },
      worldOff:  function () { return worldOff; },
      /* ── #23 が足した窓 (⛔ 読むためだけ。ここへ状態を置かない) ──────────────
         revealed  … 札を出しているノード id (way は元から札が無いので常に含まれる)
         questDest … **読んだ値**。「入る」で sessionStorage を消しても、この JS 変数は
                     読んだ時の値のまま残る (消費したかは storage の実体で測る)
         askOpen   … 確認ダイアログが開いているか (⛔ display:none が既定 = (3e) の番人) */
      revealed:  function () { return Object.keys(NODES).filter(isNodeRevealed); },
      questDest: function () { return questDest; },
      askOpen:   function () { return !!elAsk && elAsk.classList.contains("show"); },
      isMoving:  function () { return moving; },
      zoom:      function () { return zoom; },
      compact:   function () { return document.body.classList.contains("compact"); },
      insets:    insets,
      nodeIds:   function () { return Object.keys(nodeEls); },
      /* ── #40 が足した窓 (⛔ 読むためだけ。ここへ状態を置かない) ────────
         stepIds … 刻み点マーカーの id。⛔ nodeIds とは別。混ぜない。 */
      stepIds:   function () { return Object.keys(stepEls); },
      /* lastArrival  … 直近の 1 ホップの記録 {at, dest, kind, arrived}。⛔ 状態ではない
         arrivalCount … 1 ホップにつきちょうど 1 増える ((4b) が縛る)
         walkStepOff  … 撤退が効いているか (sessionStorage 経由なのでクエリ無しでも真になる)
         stepMaxPx    … 刻みの上限。⭐ ドライバはこれを読む (⛔ 320 を直書きさせない)
         clientFromPoint … 刻み点も押せるよう clientFromNode の細分化グラフ版。
                           ⚠ 式は clientFromWorld ただ 1 本へ寄せる (別式で書き直さない) */
      lastArrival:  function () { return lastArrival; },
      arrivalCount: function () { return arrivalCount; },
      walkStepOff:  function () { return walkStepOff; },
      stepMaxPx:    function () { return WM.STEP_MAX_PX; },
      clientFromPoint: function (id) {
        var g = WM.walkNodes()[id];
        if (!g) return null;
        return window.__world.clientFromWorld(g.x, g.y);
      },
      goToNode:  goToNode,
      /* ⚠ ドライバはこの値と**実描画の矩形**を突き合わせる (CSS と JS の写経ズレを殺すため)。 */
      heroGeom:  function () { return { sprite: SPRITE, foot: FOOT, rowRight: SHEET_ROW_RIGHT }; },
      /* ── #43 が足した窓 (⛔ 読むためだけ。ここへ状態を置かない) ──────────── */
      heroMarkOn:   function () { return HERO_MARK_ON; },
      /* ⚠ ドライバはこの値と **実描画の矩形** を突き合わせる (CSS と JS の写経ズレを殺すため)。
         ⛔ ドライバ側へ 9 / 13 / 32 / 8 を直書きさせない。 */
      heroMarkGeom: function () { return { w: HM_W, h: HM_H, gap: HM_GAP,
                                           headTop: HEAD_TOP, sprite: SPRITE, foot: FOOT }; },
      /* ワールド px → クライアント座標。⚠ **同じ rect と同じ zoom** から導く (別式で書き直さない)。
         ドライバが「ノードを実際にクリックする」ために要る。 */
      clientFromWorld: function (x, y) {
        var rect = elStage.getBoundingClientRect();
        return { x: rect.left + x * zoom, y: rect.top + y * zoom };
      },
      clientFromNode: function (id) {
        var n = NODES[id];
        if (!n) return null;
        return window.__world.clientFromWorld(n.x, n.y);
      }
    };

    layout();
    placeHero(heroPx.x, heroPx.y);
  })();
  </script>
</body>
</html>
